# Paid Python service and persistent storage. Review Render pricing before applying.
services:
  - type: web
    name: virtual-queuing-system
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: python -m unittest discover -v
    startCommand: python -u server.py --no-browser
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: queue-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.8
      - key: QUEUE_HOST
        value: 0.0.0.0
      - key: QUEUE_DB
        value: /var/data/queue.sqlite3
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
